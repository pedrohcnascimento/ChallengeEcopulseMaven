server.port=${PORT:8080}
spring.application.name=ecopulse-soulup-api

# Configuracao segura via variaveis de ambiente (Oracle FIAP em producao)
ecopulse.db.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
ecopulse.db.user=${DB_USER:}
ecopulse.db.password=${DB_PASSWORD:}
ecopulse.db.driver=${DB_DRIVER:oracle.jdbc.OracleDriver}
ecopulse.db.auto-init=${DB_AUTO_INIT:true}

# CORS configuravel para o Front-End
ecopulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Jackson ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
