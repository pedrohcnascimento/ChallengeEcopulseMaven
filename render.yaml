services:
  - type: web
    name: ecopulse-soulup-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_URL
        value: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: oracle.jdbc.OracleDriver
      - key: DB_AUTO_INIT
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
